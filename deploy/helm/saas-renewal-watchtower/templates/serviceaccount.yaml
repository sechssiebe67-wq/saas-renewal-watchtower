apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "saas-renewal-watchtower.serviceAccountName" . }}
  labels:
    {{- include "saas-renewal-watchtower.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
